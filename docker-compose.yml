services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      # Named volume: Docker seeds it from the image's /app/data (owned by `node`) on first use,
      # so writes work regardless of the host user's UID. A bind mount would keep host ownership.
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_API_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
